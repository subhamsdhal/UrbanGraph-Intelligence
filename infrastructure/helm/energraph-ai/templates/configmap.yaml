apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  UG_HOST: "0.0.0.0"
  UG_PORT: {{ .Values.service.port | quote }}
  UG_WORKERS: {{ .Values.config.workers | default 1 | quote }}
  UG_LOG_LEVEL: {{ .Values.config.logLevel | default "INFO" | quote }}
  UG_APP_ENV: {{ .Values.config.environment | default "production" | quote }}
  UG_PROMETHEUS_ENABLED: {{ .Values.config.prometheusEnabled | default true | quote }}

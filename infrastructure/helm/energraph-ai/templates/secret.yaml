{{- if .Values.secrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default (printf "%s-secrets" .Release.Name) }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  URBANGRAPH_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  URBANGRAPH_WORKER_TOKEN: {{ .Values.secrets.workerToken | quote }}
  URBANGRAPH_READER_TOKEN: {{ .Values.secrets.readerToken | quote }}
{{- end }}


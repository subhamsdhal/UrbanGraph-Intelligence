apiVersion: v1
kind: Service
metadata:
  name: energraph-broker-svc
  namespace: urbangraph-secure
  labels:
    app.kubernetes.io/name: energraph-broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: energraph-broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: energraph-broker-netpol
  namespace: urbangraph-secure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: energraph-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: urbangraph-intelligence
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: urbangraph-intelligence
      ports:
        - protocol: TCP
          port: 8080

# Production Deployment Profile
logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: WARNING
      formatter: standard
      stream: ext://sys.stdout
  root:
    level: WARNING
    handlers: [console]
